<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback - AL Jewellery Shop</title>
    <link rel="icon" href="Ss.jpg" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
<script src="transitions.js" defer></script>
</head>
<body>
    <div class="header">
        <div class="branding">
            <img src="https://uploads.onecompiler.io/4423z2hbn/442fnew8c/images%20(2).png" alt="AL Jewellery Shop Logo" class="logo">
            <div class="company-text">
                <h1 class="company-name">AL Jewellery Shop</h1>
            </div>
        </div>
    </div>

    <header>
        <nav>
            <ul class="nav-menu">
                <li><a href="index.html">HOME</a></li>
                <li><a href="aboutus.html">ABOUT US</a></li>
                <li><a href="product.html">PRODUCT</a></li>
                <li><a href="whyus.html">WHY CHOOSE US?</a></li>
                <li><a href="feedback.html">FEEDBACK</a></li>
                <li><a href="contact.html">CONTACT US</a></li>
            </ul>
        </nav>
    </header>

    <main class="fade-in">
        <hr>
        <section id="feedback" class="section feedback">
            <div class="container">
                <h2>Feedback</h2>
                <form id="feedbackForm" class="form">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                    <button type="submit" class="btn primary">Send</button>
                    <p id="feedbackStatus" class="muted"></p>
                </form>
            </div>
        </section>
    </main>

    <div class="bottom-nav">
        <div class="footer-content">
            <p>Copyright © 2025 AL Jewellery Shop. All rights reserved.</p>
            <a href="contact.html">Contact Us</a>
        </div>
    </div>
</body>
</html>
